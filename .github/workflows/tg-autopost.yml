name: Telegram Channel Auto-Poster (@buhly_by)

on:
  schedule:
    - cron: '0 8 * * 2,5'
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Post ID (or auto for next unsent)'
        required: false
        default: 'auto'
        type: string
      edit_message_id:
        description: 'Optional existing channel message_id to edit in place (0 = send new post)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Allow selecting an already-sent post_id (useful when editing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tg-autopost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-post:
    name: Publish next scheduled post to @buhly_by
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore and save Telegram posts state cache
        uses: actions/cache@v4
        with:
          path: tg_posts_state.json
          key: tg-posts-state-v1-${{ github.run_id }}
          restore-keys: |
            tg-posts-state-v1-

      - name: Publish queued Telegram post
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          EDIT_ID="${{ inputs.edit_message_id || '0' }}"
          python3 scripts/post_tg_queue.py --queue scripts/tg_autopost_queue.json --state tg_posts_state.json --post-id "${{ inputs.post_id || 'auto' }}" --edit-message-id "${EDIT_ID}" ${FORCE_FLAG}
